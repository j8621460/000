name: Apply WARP register-button fix

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create branch
        run: git checkout -b fix/warp-register-button-refresh

      - name: Apply patch
        run: |
          echo "" | base64 -d > /tmp/warp-fix.patch
          git apply /tmp/warp-fix.patch

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/full/java/com/celzero/bravedns/ui/activity/ProxySettingsActivity.kt app/src/main/res/values/strings.xml
          git commit -m "fix(warp): keep register button visible and repurpose as refresh"

      - name: Push branch
        run: git push origin fix/warp-register-button-refresh -f

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --title "fix(warp): keep register button visible, repurpose as refresh" --body "Fixes the WARP register button disappearing after registration. The button now stays visible and relabels to Refresh WARP config once already registered; tapping it re-registers via UsqueManager.registerWithWarp(), which deletes and recreates config.json." --base main --head fix/warp-register-button-refresh
